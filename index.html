<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma de Estudos</title>
<meta name="description" content="Cronograma de estudos para o ano todo: rotina semanal, dias personalizados, provas, revisões espaçadas e progresso individual por conta, criptografado no navegador.">
<meta name="theme-color" content="#f4f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cronograma">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='8' width='56' height='52' rx='12' fill='%235b5bd6'/%3E%3Crect x='4' y='8' width='56' height='16' rx='8' fill='%233f3fb8'/%3E%3Cpath d='M20 40l8 8 16-18' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<script>
/* Aplica o tema salvo antes da pintura, para não piscar */
try{var t=localStorage.getItem("cronograma-provas-tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#f4f5fa; --surface:#ffffff; --surface-2:#f0f2f8; --ink:#1e2235; --muted:#5e6478; --line:#e3e6ef; --box:#c4c9d8;
  --accent:#5b5bd6; --accent-ink:#3f3fb8; --accent-bg:#ececfc; --on-accent:#ffffff;
  --ok:#2f7d4f; --ok-bg:#e5f4ec; --warn:#a35a00; --warn-bg:#fff3e0;
  --shadow:0 1px 2px rgba(30,34,53,.04),0 8px 24px rgba(30,34,53,.06);
  --shadow-lg:0 12px 40px rgba(30,34,53,.16);
  --onco:#8a3f74; --onco-bg:#f6e9f2;
  --morfo:#1f7a7a; --morfo-bg:#e3f3f2;
  --clin:#b46a12; --clin-bg:#fbefdc;
  --fixo:#4a5a6b; --fixo-bg:#e9edf2;
  --pesq:#3c7a3a; --pesq-bg:#e6f2e4;
  --prova:#c23b3b; --prova-bg:#fdecec; --prova-line:#f3b9b9;
  --azul:#2f5fbf; --roxo:#6b4fbf; --rosa:#c23a74; --ciano:#0e7490; --oliva:#6a7419; --marrom:#8a5530;
  --font-display:"Nunito",ui-rounded,ui-sans-serif,system-ui,sans-serif;
  --font-body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:12px;
  --top-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1b1e2a; --surface-2:#232737; --ink:#e9eaf2; --muted:#a3a8bc; --line:#2e3346; --box:#4a5068;
  --accent:#9b9bf5; --accent-ink:#c3c3ff; --accent-bg:#26284a; --on-accent:#12141c;
  --ok:#7fd1a0; --ok-bg:#183126; --warn:#f0b35c; --warn-bg:#352712;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --onco:#d58bbf; --onco-bg:#33202d; --morfo:#5cc2c0; --morfo-bg:#16302f;
  --clin:#e7a656; --clin-bg:#352712; --fixo:#a9b6c3; --fixo-bg:#262f3a;
  --pesq:#86c983; --pesq-bg:#1c2f1b; --prova:#f0796b; --prova-bg:#3a1e1b; --prova-line:#6b2f29;
  --azul:#7fa6f5; --roxo:#b19ef0; --rosa:#ee8ab3; --ciano:#5ccbe6; --oliva:#c3cc6e; --marrom:#d9a57f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1b1e2a; --surface-2:#232737; --ink:#e9eaf2; --muted:#a3a8bc; --line:#2e3346; --box:#4a5068;
  --accent:#9b9bf5; --accent-ink:#c3c3ff; --accent-bg:#26284a; --on-accent:#12141c;
  --ok:#7fd1a0; --ok-bg:#183126; --warn:#f0b35c; --warn-bg:#352712;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --onco:#d58bbf; --onco-bg:#33202d; --morfo:#5cc2c0; --morfo-bg:#16302f;
  --clin:#e7a656; --clin-bg:#352712; --fixo:#a9b6c3; --fixo-bg:#262f3a;
  --pesq:#86c983; --pesq-bg:#1c2f1b; --prova:#f0796b; --prova-bg:#3a1e1b; --prova-line:#6b2f29;
  --azul:#7fa6f5; --roxo:#b19ef0; --rosa:#ee8ab3; --ciano:#5ccbe6; --oliva:#c3cc6e; --marrom:#d9a57f; color-scheme:dark}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--top-h) + 12px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-ink)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.lbl2{font-size:13px;color:var(--muted);font-weight:700}

/* ---------- botões ---------- */
.btn{flex:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);min-height:40px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer;line-height:1.2;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s,color .15s,opacity .15s}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary,.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--prova)}
.btn.armed{background:var(--prova)!important;border-color:var(--prova)!important;color:#fff!important}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.sm svg{width:14px;height:14px}
.ib{flex:none;width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--muted);padding:0;position:relative;transition:color .15s,border-color .15s,background .15s}
.ib:hover{color:var(--ink);border-color:var(--muted)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:15px;height:15px}
.ib.lg{width:42px;height:42px;border-radius:50%}
.ib.lg svg{width:18px;height:18px}
.ib.ghost{border-color:transparent;background:none}
.chip{--k:var(--muted);border-radius:999px;min-height:34px;font-size:13px;padding:0 12px}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--k);display:inline-block;flex:none}
.chip[aria-pressed="true"]{background:var(--k);border-color:var(--k);color:var(--surface)}
.chip[aria-pressed="true"] .sw{background:var(--surface)}
.lnk{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.badge{font-family:var(--font-body);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:6px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.exam{background:var(--prova);color:#fff}
.badge.soft{background:var(--surface-2);color:var(--muted)}
.pickwrap{position:relative;overflow:hidden}
.pickwrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0;margin:0}

/* ---------- carregamento ---------- */
.boot{min-height:100dvh;display:grid;place-items:center}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- login ---------- */
.auth{min-height:100dvh;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(900px 520px at 0% -10%,var(--accent-bg),transparent 65%),radial-gradient(800px 480px at 105% 110%,var(--morfo-bg),transparent 60%),var(--bg)}
.auth-card{width:min(440px,100%);padding:28px 24px 24px;display:grid;gap:18px}
.auth-brand{display:flex;align-items:center;gap:12px}
.auth-brand svg{width:46px;height:46px;flex:none}
.auth h1{font-family:var(--font-display);font-weight:800;font-size:25px;line-height:1.15;margin:0}
.auth .lead{margin:2px 0 0;color:var(--muted);font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:38px;font-weight:700;color:var(--muted);cursor:pointer;font-size:14px;padding:0 8px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.af{display:grid;gap:12px}
.af .btn.primary{min-height:48px;font-size:15px;width:100%}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.pw{position:relative;display:block}
.pw input{padding-right:48px!important}
.pw .ib{position:absolute;right:5px;top:50%;transform:translateY(-50%);border-color:transparent;background:none}
.accs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.fine b{color:var(--ink)}
.err{color:var(--prova);font-size:14px;font-weight:700;margin:0}

/* ---------- formulários ---------- */
.fld{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted);grid-column:1/-1;align-content:start;min-width:0}
.fld.half{grid-column:auto}
.fld input:not([type="checkbox"]),.fld select,.fld textarea{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;width:100%;min-width:0;min-height:44px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld textarea{resize:vertical}
.fld small{font-weight:400}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-weight:700;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.selrow{display:flex;gap:8px;align-items:center}
.selrow .sw{width:24px;height:24px;border-radius:50%;flex:none}

/* ---------- topo e navegação ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:var(--top-h)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:18px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:32px;height:32px}
.nav{display:flex;gap:2px;margin-inline:auto;background:var(--surface-2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.nav a{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;transition:color .15s,background .15s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:17px;height:17px}
.nav .n{display:none}
.acct{position:relative;flex:none;margin-left:auto}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--font-display);font-weight:800;font-size:17px;display:grid;place-items:center;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.pop{position:absolute;right:0;top:calc(100% + 10px);z-index:30;width:280px;padding:8px;display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg)}
.pop .who{padding:8px 10px 10px;display:grid;line-height:1.3}
.pop .who b{font-family:var(--font-display);font-size:16px}
.pop .who span{font-size:13px;color:var(--muted)}
.pop .seg{margin:2px 4px 6px}
.pop .seg button{min-height:32px;font-size:13px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px;width:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:10px;min-height:42px;padding:0 10px;font-weight:600;font-size:14px;cursor:pointer;text-align:left;color:var(--ink)}
.mi:hover{background:var(--surface-2)}
.mi svg{width:17px;height:17px;color:var(--muted);flex:none}
.mi.danger,.mi.danger svg{color:var(--prova)}
.mi.armed{background:var(--prova);color:#fff}
.mi.armed svg{color:#fff}
.tabbar{display:none}
@media (max-width:899px){
  .top .nav{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
  .tabbar a{flex:1;min-width:0;display:grid;justify-items:center;gap:3px;padding:2px 0;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none}
  .tabbar svg{width:20px;height:20px;box-sizing:content-box;padding:4px 16px;border-radius:999px;transition:background .15s}
  .tabbar a[aria-current="page"]{color:var(--accent-ink)}
  .tabbar a[aria-current="page"] svg{background:var(--accent-bg)}
}

/* ---------- vistas ---------- */
.view{padding-block:22px 56px;display:grid;gap:18px;min-width:0}
@media (max-width:899px){.view{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}}
.vnav{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;justify-content:space-between}
.vt{min-width:0}
.vt .rel{font-size:12.5px;font-weight:800;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.07em}
.vt h1{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,3.6vw,34px);line-height:1.12;margin:0;letter-spacing:-.01em;text-wrap:balance}
.vt .vs{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.vc{display:flex;gap:6px;align-items:center}
.vc .btn{min-height:42px;border-radius:999px}
.sec-h{font-family:var(--font-display);font-weight:800;font-size:19px;margin:0}

/* faixa da semana */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:grid;justify-items:center;gap:1px;padding:8px 2px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);position:relative;transition:border-color .15s,background .15s,transform .15s;font-variant-numeric:tabular-nums}
.wd:hover{border-color:var(--accent)}
.wd .w{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.wd .n{font-family:var(--font-display);font-size:21px;font-weight:800;line-height:1.15}
.wd .bar{width:58%;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.wd .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.wd.full .bar i{background:var(--ok)}
.wd.late .bar i{background:var(--warn)}
.wd .xd{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--prova)}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd.today .w{color:var(--accent-ink)}
.wd.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.wd.sel .w{color:var(--on-accent);opacity:.9}
.wd.sel .bar{background:color-mix(in srgb,var(--on-accent) 30%,transparent)}
.wd.sel .bar i{background:var(--on-accent)}
.wd.sel .xd{background:var(--on-accent)}

/* grade da vista de dia */
.dgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto 1fr;grid-template-areas:"card now" "card side";align-items:start}
.dgrid.nonow{grid-template-areas:"card side" "card side"}
.g-now{grid-area:now}.g-card{grid-area:card;min-width:0}.g-side{grid-area:side;display:grid;gap:16px;min-width:0}
@media (max-width:979px){
  .dgrid{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"now" "card" "side"}
  .dgrid.nonow{grid-template-areas:"card" "side"}
  .g-side{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
}

/* cartão "Agora" */
.now{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--roxo)));color:var(--on-accent);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.now .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:800;font-family:var(--font-display)}
.now .pill{background:color-mix(in srgb,var(--on-accent) 20%,transparent);border-radius:999px;padding:2px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:12.5px;font-family:var(--font-body)}
.now .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.now .what{font-family:var(--font-display);font-weight:800;font-size:23px;line-height:1.2}
.now .det{font-size:14px;opacity:.92;margin-top:2px}
.now .nex{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:700;background:color-mix(in srgb,var(--on-accent) 16%,transparent);border-radius:10px;padding:6px 10px}
.now .nex svg{width:16px;height:16px;flex:none}
.now .meter{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.now .meter .track{flex:1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--on-accent) 25%,transparent);overflow:hidden}
.now .meter i{display:block;height:100%;background:var(--on-accent);border-radius:4px}
.now .btn{border-color:var(--on-accent);background:var(--on-accent);color:var(--accent-ink);align-self:flex-start}

/* cartão do dia */
.dcard{overflow:hidden;display:flex;flex-direction:column}
.dcard.examday{border-color:var(--prova-line)}
.dcard.complete{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.dch{display:flex;align-items:center;gap:10px;padding:14px 16px 12px 18px;border-bottom:1px solid var(--line)}
.dch-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dch h2{font-family:var(--font-display);font-weight:800;font-size:19px;margin:0;min-width:0;overflow-wrap:anywhere}
.edit-note{margin:12px 14px 4px;padding:12px 14px;background:var(--accent-bg);border-radius:var(--r-md);font-size:13.5px;color:var(--ink);display:grid;gap:10px}
.exb{display:flex;align-items:center;gap:12px;margin:12px 14px 0;padding:12px 12px 12px 14px;border-radius:var(--r-md);background:var(--prova-bg);border:1px solid var(--prova-line);color:var(--prova)}
.exb .exi{width:36px;height:36px;border-radius:10px;background:var(--prova);color:#fff;display:grid;place-items:center;flex:none}
.exb .exi svg{width:18px;height:18px}
.exb .ext{flex:1;min-width:0;display:grid}
.exb b{font-family:var(--font-display);font-size:16px}
.exb span{font-size:13.5px;color:var(--ink)}
.exb .ib{background:transparent;border-color:transparent;color:var(--prova)}
ul.blocks{list-style:none;margin:0;padding:8px 6px 8px}
.blk{position:relative}
.blk .row{display:grid;grid-template-columns:26px 96px minmax(0,1fr);gap:12px;align-items:start;padding:11px 12px;border-radius:var(--r-md);cursor:pointer;transition:background .12s;-webkit-tap-highlight-color:transparent;min-height:48px}
.blk .row:hover{background:var(--surface-2)}
.blk input{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;border-radius:8px;border:2px solid var(--k);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:background .15s,transform .15s}
.blk input::after{content:"";width:12px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .15s}
.blk input:checked{background:var(--k)}
.blk input:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.blk input:active{transform:scale(.9)}
.blk .dotk{width:12px;height:12px;border-radius:50%;background:var(--k);margin:6px 0 0 6px}
.blk .t{font-size:13px;font-weight:600;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.blk .c{min-width:0}
.blk .lbl{display:inline-block;max-width:100%;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--k);background:color-mix(in srgb,var(--k) 13%,var(--surface));border-radius:6px;padding:2px 8px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.blk .d{font-size:14.5px;display:block}
.blk.done .d{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.blk.done .lbl{opacity:.6}
.blk.current .row{background:var(--accent-bg);box-shadow:inset 0 0 0 1.5px var(--accent)}
.blk.current .t{color:var(--accent-ink);font-weight:800}
.blk.current .t::after{content:"agora";display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.blk.pause .row{cursor:default;min-height:0;padding-block:7px}
.blk.pause .row:hover{background:none}
.blk.pause .c{color:var(--muted);font-size:13.5px}
.blk.pause .c::before{content:"";display:inline-block;width:14px;border-top:1.5px dashed var(--box);vertical-align:middle;margin-right:8px}
.blk .tools{position:absolute;top:8px;right:8px;display:flex;gap:3px}
.blk .tools .ib{width:30px;height:30px}
.editing .blk .c,.rlist .blk .c{padding-right:104px}
.addblk{display:block;width:calc(100% - 28px);margin:4px 14px 12px;border:2px dashed var(--line);background:none;border-radius:var(--r-md);padding:10px;color:var(--muted);font-size:14px;font-weight:700;cursor:pointer}
.addblk:hover{border-color:var(--accent);color:var(--accent-ink)}
.dempty{margin:14px;padding:22px 16px;border:2px dashed var(--line);border-radius:var(--r-md);text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.dempty p{margin:0;max-width:44ch}
.dempty b{color:var(--ink)}
.revday{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 18px 14px}
.revday .chip{min-height:32px;font-size:12.5px}
.revday .chip.on{background:var(--ok-bg);border-color:transparent;color:var(--ok);cursor:default}
.dprog{margin-top:auto;padding:12px 18px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.complete .dprog .track i{background:var(--ok)}
.dprog b{color:var(--ink)}

/* cartões laterais */
.scard{padding:16px 16px 14px}
.scard h2{font-family:var(--font-display);font-size:16px;font-weight:800;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}
.scard h2 .ib{width:30px;height:30px}
.scard .empty-s{margin:0;color:var(--muted);font-size:13.5px}
.scard .more{display:inline-block;margin-top:10px;font-size:13px;font-weight:800;text-decoration:none}
.exl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.exr{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;padding:8px;border-radius:12px;transition:background .12s}
.exr:hover{background:var(--surface-2)}
.cd{width:50px;height:50px;border-radius:14px;background:var(--prova-bg);color:var(--prova);display:grid;place-content:center;text-align:center;font-family:var(--font-display);font-weight:800;line-height:1;flex:none}
.cd b{font-size:20px}
.cd small{font-size:10.5px;font-family:var(--font-body);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.cd.hoje{background:var(--prova);color:#fff}
.ex-t{min-width:0;display:grid}
.ex-t b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-t small{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:118px}
.bars a{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:800;text-transform:uppercase;min-height:0}
.bars .p{font-size:10.5px;color:var(--muted);text-transform:none;font-variant-numeric:tabular-nums}
.bars .col{width:100%;max-width:30px;background:var(--surface-2);border-radius:8px;position:relative;overflow:hidden;min-height:0}
.bars .col i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:8px}
.bars a.full .col i{background:var(--ok)}
.bars a.late .col i{background:var(--warn)}
.bars a.today{color:var(--accent-ink)}
.bars a.none .col{background:repeating-linear-gradient(-45deg,var(--surface-2) 0 4px,transparent 4px 8px)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kpi{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:grid;line-height:1.25;text-decoration:none;color:inherit;border:0;text-align:left;font:inherit;cursor:default}
a.kpi,button.kpi{cursor:pointer}
.kpi b{font-family:var(--font-display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.kpi.warn b{color:var(--warn)}
.kpi.ok b{color:var(--ok)}
.rv-mini{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rv-mini li{--k:var(--fixo);display:flex;gap:8px;align-items:center;padding:7px 8px 7px 10px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--k)}
.rv-mini .tx{flex:1;min-width:0;display:grid;line-height:1.3}
.rv-mini .tx b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-mini .tx small{font-size:12px;color:var(--muted)}
.rv-mini .late{color:var(--warn);font-weight:800}
details.nts summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:16px;min-height:30px}
details.nts summary::-webkit-details-marker{display:none}
details.nts summary::before{content:"";width:7px;height:7px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;margin-right:2px}
details.nts[open] summary::before{transform:rotate(45deg)}
.note{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;min-width:0;position:relative}
.note h3{font-family:var(--font-display);font-size:15px;font-weight:800;margin:0 0 4px}
.note p,.note ul{margin:0;color:var(--muted);font-size:14px}
.note ul{padding-left:18px}
.note p+p,.note p+ul,.note ul+p{margin-top:6px}
.nts .notes{display:grid;gap:8px;margin-top:10px}

/* semana */
.wsum{display:flex;flex-wrap:wrap;gap:8px}
.pillk{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--muted)}
.pillk b{color:var(--ink);font-family:var(--font-display);font-size:15px}
.pillk.exam b{color:var(--prova)}
.wgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.wgrid{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}}
.wcol{display:flex;flex-direction:column;overflow:hidden;border-radius:16px;min-width:0}
.wcol.today{border:2px solid var(--accent)}
.wcol.examday{border-color:var(--prova-line)}
.wcol.today.examday{border-color:var(--accent)}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:10px 12px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.wh:hover{background:var(--surface-2)}
.wh .dn{font-family:var(--font-display);font-weight:800;font-size:16px;white-space:nowrap}
.wh .dn small{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:700;margin-left:4px}
.wh .pc{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.wh .pc.ok{color:var(--ok)} .wh .pc.late{color:var(--warn)}
.wcol.today .wh{background:var(--accent-bg)}
.wtag{padding:6px 12px 0;font-size:12px;font-weight:700;color:var(--muted);overflow-wrap:anywhere}
.wex{display:flex;gap:6px;align-items:center;margin:8px 8px 0;padding:6px 8px;border-radius:10px;background:var(--prova);color:#fff;font-size:12.5px;font-weight:800;text-decoration:none;overflow-wrap:anywhere}
.wex svg{width:14px;height:14px;flex:none}
.cbl{list-style:none;margin:0;padding:6px;display:grid;gap:2px}
.cb label{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start;padding:6px 6px;border-radius:10px;cursor:pointer}
.cb label:hover{background:var(--surface-2)}
.cb input{appearance:none;-webkit-appearance:none;margin:2px 0 0;width:18px;height:18px;border-radius:6px;border:2px solid var(--k);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.cb input::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .15s}
.cb input:checked{background:var(--k)}
.cb input:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.cb .t{display:block;font-size:11.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.cb .l{display:block;font-size:13.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.cb.done .l{text-decoration:line-through;color:var(--muted)}
.cb.pause{font-size:12px;color:var(--muted);padding:3px 8px 3px 32px}
.cb.pause .t{display:inline;font-size:11.5px}
.wempty{margin:0;padding:14px 12px;color:var(--muted);font-size:13px;text-align:center}
.wbar{margin-top:auto;height:4px;background:var(--line)}
.wbar i{display:block;height:100%;background:var(--accent)}
.wcol.full .wbar i{background:var(--ok)}

/* mês */
.mwrap{padding:14px}
.mhd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.mhd span{text-align:center;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mc{min-height:96px;padding:7px 8px 8px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);min-width:0;overflow:hidden;transition:border-color .15s}
.mc:hover{border-color:var(--accent)}
.mc.out{opacity:.4}
.mc.today{border:2px solid var(--accent);background:var(--accent-bg)}
.mc .n{font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1.2;font-variant-numeric:tabular-nums}
.mc .ex{font-size:11px;font-weight:800;color:#fff;background:var(--prova);border-radius:6px;padding:1px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .tg{font-size:11px;color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .rv{font-size:11px;color:var(--accent-ink);font-weight:800}
.mc .pb{margin-top:auto;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.mc .pb i{display:block;height:100%;background:var(--accent)}
.mc.full .pb i{background:var(--ok)}
.mc.late .pb i{background:var(--warn)}
.mc.full{background:color-mix(in srgb,var(--ok-bg) 80%,var(--surface))}
.mleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:700}
.mleg span{display:inline-flex;align-items:center;gap:6px}
.mleg i{width:14px;height:5px;border-radius:3px;display:inline-block}
@media (max-width:640px){
  .mwrap{padding:8px}
  .mgrid,.mhd{gap:4px}
  .mc{min-height:60px;padding:5px 5px 6px;border-radius:9px;gap:2px}
  .mc .n{font-size:14px}
  .mc .ex{font-size:0;width:8px;height:8px;padding:0;border-radius:50%}
  .mc .tg,.mc .rv{display:none}
}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}

/* revisões */
.rev{padding:18px;display:grid;gap:14px}
.rev-flow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.rev-flow li{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 10px}
.rev-flow li b{color:var(--accent-ink)}
.rev-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px;margin:-3px}
.rev-tabs::-webkit-scrollbar{display:none}
.rev-tabs .chip{--k:var(--accent)}
.rev-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rev-list h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 2px 0}
.ri{--k:var(--fixo);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);border-left:4px solid var(--k)}
.ri .txt{flex:1 1 220px;min-width:0}
.ri .nm{font-weight:800;display:block;overflow-wrap:anywhere}
.ri .meta{font-size:13px;color:var(--muted);display:block}
.ri .meta .late,.rv-mini .late{color:var(--warn);font-weight:800}
.ri .meta .warn{color:var(--prova);font-weight:700}
.ri .acts{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.ri.done{opacity:.75}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots span{font-size:10.5px;font-weight:800;min-width:30px;text-align:center;border-radius:6px;padding:1px 4px;border:1.5px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.dots span.ok{background:var(--k);border-color:var(--k);color:var(--surface)}
.dots span.cur{border-color:var(--accent);color:var(--accent-ink)}
.rev-empty{margin:0;color:var(--muted);font-size:14px;padding:18px 12px;text-align:center;border:2px dashed var(--line);border-radius:var(--r-md)}
.why{font-size:13.5px;color:var(--muted)}
.why summary{cursor:pointer;font-weight:800;color:var(--ink);min-height:32px;display:flex;align-items:center}
.why ul,.why ol{padding-left:18px;margin:6px 0 0}
.why li+li{margin-top:4px}
.why p{margin:6px 0 0}
.refs{font-size:13px;color:var(--muted);padding:16px 18px}
.refs h3{font-family:var(--font-display);font-weight:800;font-size:16px;margin:0 0 4px;color:var(--ink)}
.refs p{margin:0}
.refs ol{padding-left:18px;margin:6px 0 0}

/* planejar */
.pgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
.pgrid>div{display:grid;gap:18px;min-width:0}
@media (max-width:979px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pcard{padding:18px;display:grid;gap:14px;min-width:0}
.pcard>header{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.pcard>header p{margin:2px 0 0;color:var(--muted);font-size:13.5px;max-width:60ch}
.pchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px;margin:-3px}
.pchips::-webkit-scrollbar{display:none}
.pchips .chip{--k:var(--accent)}
.pinfo{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;flex-wrap:wrap}
.pinfo .tx{flex:1;min-width:0;display:grid;line-height:1.35}
.pinfo b{font-family:var(--font-display);font-size:16px}
.pinfo small{font-size:13px;color:var(--muted)}
.pinfo .now-b{color:var(--ok);font-weight:800}
.wdtabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.wdtabs button{border:0;background:none;border-radius:9px;min-height:44px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;display:grid;place-content:center;line-height:1.15;padding:2px 0}
.wdtabs button small{font-weight:700;font-size:10.5px;opacity:.8}
.wdtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.rlist{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.rlist ul.blocks{padding:6px 4px}
.rlist .blk .row{cursor:default}
.rlist .blk .row:hover{background:none}
.rlist .addblk{width:calc(100% - 16px);margin:4px 8px 8px}
.rlist .dempty{margin:8px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pli{--k:var(--fixo);display:flex;gap:10px;align-items:center;padding:8px 8px 8px 12px;border-radius:12px;background:var(--surface-2);border-left:4px solid var(--k);min-width:0}
.pli .tx{flex:1;min-width:0;display:grid;line-height:1.3;text-decoration:none;color:inherit}
.pli .tx b{font-size:14px;overflow-wrap:anywhere}
.pli .tx small{font-size:12.5px;color:var(--muted)}
.pli.past{opacity:.6}
.subs{display:flex;flex-wrap:wrap;gap:8px}
details.past summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--muted);margin-top:4px}
details.past .plist{margin-top:8px}
.ntgrid{display:grid;gap:8px}
.ntgrid .note .ib{position:absolute;top:8px;right:8px;width:30px;height:30px}
.ntgrid .note h3{padding-right:36px}

/* diálogos */
dialog.dlg{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.dlg::backdrop{background:rgba(18,20,28,.55)}
.dlg form,.dlg .dlg-in{display:flex;flex-direction:column;max-height:calc(100dvh - 26px)}
.dlg h2{font-family:var(--font-display);font-weight:800;font-size:21px;margin:0;padding:18px 20px 4px}
.dlg .dlg-sub{margin:0;padding:0 20px;color:var(--muted);font-size:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 20px 4px;overflow:auto}
.dlg-err{color:var(--prova);font-size:14px;font-weight:700;margin:6px 20px 0}
.dlg-act{display:flex;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line);margin-top:10px;flex-wrap:wrap;align-items:center}
.ai-step{display:grid;gap:8px}
.ai-step h3{font-family:var(--font-display);font-weight:800;font-size:16px;margin:0;display:flex;gap:10px;align-items:center}

<main class="auth" id="auth" hidden>

      <label class="fld" data-up hidden><span>Seu nome</span><input name="name" autocomplete="name" placeholder="ex.: Taís" maxlength="40"></label>
      <label class="fld"><span>Usuário</span><input name="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex.: tais" maxlength="32" required></label>
      <label class="fld"><span>Senha</span><span class="pw"><input name="pw" type="password" autocomplete="current-password" required><button type="button" class="ib" data-act="pw-eye" aria-label="Mostrar senha"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg></button></span></label>

  </section>

/* ===================== criptografia (contas locais) ===================== */
/* Senha → PBKDF2-SHA-256 → chave AES-GCM de 256 bits. Os dados de cada conta ficam
   cifrados no localStorage; sem a senha (ou a sessão aberta) ninguém lê o conteúdo. */
const PBKDF2_ITER=600000;
const te=new TextEncoder(), td=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
}
/* sealText cifra um texto que já é JSON; seal serializa o objeto antes */
async function sealText(key,json){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,te.encode(json));
  return{iv:b64(iv),ct:b64(ct)};
}
const seal=(key,obj)=>sealText(key,JSON.stringify(obj));
async function unseal(key,box){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct));
  return JSON.parse(td.decode(pt));
}

const ACC_KEY="cronograma:contas", DATA_PREFIX="cronograma:dados:", SESS_KEY="cronograma:sessao", LEGACY_FLAG="cronograma:legado-importado";

const saveAccounts=a=>store.set(ACC_KEY,JSON.stringify(a));
let account=null, key=null, doc=null;

async function loadDoc(a,k){
  const raw=store.get(DATA_PREFIX+a.id);
  if(!raw)return blankDoc();
  try{return normDoc(await unseal(k,JSON.parse(raw)))}
  catch(e){throw new Error("Não foi possível abrir os dados desta conta.")}

async function signUp(f){
  const accs=accounts();
  if(accs.some(a=>a.user===f.user))throw new Error("Já existe uma conta com esse usuário neste aparelho.");
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const k=await deriveKey(f.pw,salt,PBKDF2_ITER);
  const id=uid("u");
  let d;
  if(f.start==="legacy"){d=legacyDoc()||sampleDoc();store.set(LEGACY_FLAG,"1")}
  else if(f.start==="ai"){d=blankDoc();history.replaceState(null,"","#/ia/tudo")}
  else d=f.start==="blank"?blankDoc():sampleDoc();
  d.profile={name:f.name};
  const a={id,user:f.user,name:f.name,salt:b64(salt),iter:PBKDF2_ITER,ver:await seal(k,"ok"),created:new Date().toISOString()};
  if(!store.set(DATA_PREFIX+id,JSON.stringify(await seal(k,d))))throw new Error("O navegador não deixou salvar (armazenamento cheio ou bloqueado).");
  accs.push(a); saveAccounts(accs);
  await startSession(a,k,d,f.remember);
}
async function signIn(f){
  const a=accounts().find(x=>x.user===f.user);
  if(!a)throw new Error("Usuário não encontrado neste aparelho. Crie uma conta ou importe um backup.");
  const k=await deriveKey(f.pw,unb64(a.salt),a.iter||PBKDF2_ITER);
  try{await unseal(k,a.ver)}catch(e){throw new Error("Senha incorreta.")}
  await startSession(a,k,await loadDoc(a,k),f.remember);
}
async function startSession(a,k,d,remember){
  account={id:a.id,user:a.user,name:a.name||a.user}; key=k; doc=d;
  const s=JSON.stringify({id:a.id,k:b64(await crypto.subtle.exportKey("raw",k))});
  sess.set(SESS_KEY,s);
  if(remember)store.set(SESS_KEY,s);else store.del(SESS_KEY);
  enterApp();
}
async function resume(){
  const raw=sess.get(SESS_KEY)||store.get(SESS_KEY); if(!raw)return false;
  try{
    const s=JSON.parse(raw), a=accounts().find(x=>x.id===s.id); if(!a)throw 0;
    const k=await crypto.subtle.importKey("raw",unb64(s.k),{name:"AES-GCM"},true,["encrypt","decrypt"]);
    await unseal(k,a.ver);
    const d=await loadDoc(a,k);
    account={id:a.id,user:a.user,name:a.name||a.user}; key=k; doc=d; sess.set(SESS_KEY,raw);
    enterApp(); return true;
  }catch(e){console.warn("Sessão não restaurada:",e);sess.del(SESS_KEY);store.del(SESS_KEY);return false}
}
let saveChain=Promise.resolve();
function persist(){
  if(!doc||!key||!account)return;
  const snap=JSON.stringify(doc), k=key, id=account.id;

    const box=await sealText(k,snap);

  }).catch(()=>toast("Não foi possível salvar"));
}
async function logout(msg){
  await saveChain;
  sess.del(SESS_KEY); store.del(SESS_KEY);

}

const COLORS=[["onco","Vinho"],["morfo","Verde-azulado"],["clin","Âmbar"],["pesq","Verde"],["fixo","Cinza"],["azul","Azul"],["roxo","Roxo"],["rosa","Rosa"],["ciano","Ciano"],["oliva","Oliva"],["marrom","Marrom"],["prova","Vermelho"]];
const COLOR_KEYS=new Set(COLORS.map(c=>c[0]));
const WD_KEYS={dom:0,domingo:0,seg:1,segunda:1,ter:2,"terça":2,terca:2,qua:3,quarta:3,qui:4,quinta:4,sex:5,sexta:5,sab:6,"sáb":6,sabado:6,"sábado":6};
const DONE_RE=/^\d{4}-\d{2}-\d{2}\|[A-Za-z0-9_-]{1,64}$/;

/* Valida e completa um planejamento vindo do armazenamento, de um backup ou de uma IA.
   fresh=true gera ids novos. Aceita "days" como lista (formato antigo e da IA) ou mapa por data;
   blocos do tipo "prova" dentro de dias viram itens de "exams". */
function normDoc(o,fresh){
  o=o&&typeof o==="object"&&!Array.isArray(o)?o:{};
  const used=new Set(), subjects=[], seenK=new Set();
  const id=(v,p)=>{let x=!fresh&&typeof v==="string"&&ID_RE.test(v)?v:uid(p);while(used.has(x))x=uid(p);used.add(x);return x};
  const addSubject=(k,n,c)=>{
    if(seenK.has(k))return; seenK.add(k);
    subjects.push({k,n:n||k,c:COLOR_KEYS.has(c)?c:COLORS[subjects.length%(COLORS.length-1)][0]});
  };
  (Array.isArray(o.subjects)?o.subjects:[]).forEach(s=>{if(s&&typeof s.k==="string"&&ID_RE.test(s.k))addSubject(s.k,str(s.n),s.c)});
  const subjK=v=>{let k=str(v);if(!ID_RE.test(k))k="geral";if(!seenK.has(k))addSubject(k,k==="geral"?"Geral":k);return k};
  const isExam=b=>b&&typeof b==="object"&&b.type==="prova";
  const block=b=>{
    if(!b||typeof b!=="object")return null;
    const type=b.type==="pausa"||b.pause===true?"pausa":"estudo";
    const k=type==="pausa"?"":subjK(b.k);
    const nb={id:id(b.id,"b"),type,k,t:str(b.t),l:type==="pausa"?"":str(b.l),d:str(b.d)};
    if(type==="pausa"&&!nb.d)nb.d="Pausa";
    if(type!=="pausa"&&!nb.l)nb.l=(subjects.find(s=>s.k===k)||{n:"Estudo"}).n;
    return nb;
  };
  const blocks=l=>l.filter(b=>!isExam(b)).map(block).filter(Boolean);
  const exams=[];
  const exam=(e,date)=>{
    if(!e||typeof e!=="object"||!validDate(date))return;
    const k=str(e.k);
    exams.push({id:id(e.id,"e"),date,t:str(e.t),k:k&&ID_RE.test(k)?subjK(k):"",l:str(e.l)||"Prova",d:str(e.d)});
  };
  const periods=[];
  (Array.isArray(o.periods)?o.periods:[]).forEach(p=>{
    if(!p||typeof p!=="object"||!validDate(p.start))return;
    const week=[[],[],[],[],[],[],[]], src=p.week;
    if(Array.isArray(src))src.slice(0,7).forEach((l,i)=>{if(Array.isArray(l))week[i]=blocks(l)});
    else if(src&&typeof src==="object")Object.entries(src).forEach(([kk,l])=>{
      const i=/^[0-6]$/.test(kk)?+kk:WD_KEYS[kk.trim().toLowerCase()];
      if(i!=null&&Array.isArray(l))week[i]=blocks(l);
    });
    periods.push({id:id(p.id,"p"),name:str(p.name)||"Rotina",start:p.start,end:validDate(p.end)&&p.end>=p.start?p.end:"",week});
  });
  const days={};
  const addDay=(date,d)=>{
    if(!validDate(date)||!d||typeof d!=="object")return;
    const list=Array.isArray(d.b)?d.b:Array.isArray(d.blocks)?d.blocks:null;
    const cur=days[date]||{}, tag=str(d.tag);
    if(tag&&!cur.tag)cur.tag=tag;
    if(list){list.filter(isExam).forEach(b=>exam(b,date));cur.b=(cur.b||[]).concat(blocks(list))}
    if(cur.tag||cur.b)days[date]=cur;
  };
  if(Array.isArray(o.days))o.days.forEach(d=>d&&addDay(d.date,d));
  else if(o.days&&typeof o.days==="object")Object.entries(o.days).forEach(([date,d])=>addDay(date,d));
  (Array.isArray(o.exams)?o.exams:[]).forEach(e=>e&&exam(e,e.date));
  exams.sort(byExam);
  const notes=(Array.isArray(o.notes)?o.notes:[]).filter(n=>n&&(str(n.h)||str(n.t))).map(n=>({id:id(n.id,"n"),h:str(n.h),t:str(n.t)}));
  const done={};
  if(o.done&&typeof o.done==="object")Object.keys(o.done).forEach(k=>{if(o.done[k]&&DONE_RE.test(k))done[k]=1});
  return{v:2,profile:{name:str(o.profile&&o.profile.name)},subjects,periods,days,exams,notes,done,reviews:normRev(o.reviews)};
}
function blockStart(t){const r=blockRange(t);return r?r[0]:null}
function byExam(a,b){return a.date<b.date?-1:a.date>b.date?1:(blockStart(a.t)??999)-(blockStart(b.t)??999)}

      const id=day.id+"-"+i; // mesmo id da versão antiga: o progresso já salvo continua valendo
      if(b.pause)return{id,type:"pausa",t:b.t,d:b.d};
      if(b.k==="prova")return{id,type:"prova",k:EXAM_SUBJECT[day.id]||"",t:b.t,l:b.l,d:b.d};
      return{id,type:"estudo",k:b.k,t:b.t,l:b.l,d:b.d};

function blankDoc(){return normDoc({subjects:[{k:"geral",n:"Geral",c:"azul"}],periods:[{name:"Minha rotina",start:TODAY,end:"",week:{}}]})}

function hasLegacy(){

/* ===================== dados: consultas ===================== */
const subj=k=>doc.subjects.find(s=>s.k===k);
const colorOf=k=>(subj(k)||{c:"fixo"}).c;
/* período que vale numa data: o que contém a data e começou por último */
function periodFor(date){
  let best=null;
  doc.periods.forEach(p=>{if(p.start<=date&&(!p.end||date<=p.end)&&(!best||p.start>=best.start))best=p});
  return best;
}
/* o dia de uma data: dia personalizado, se houver; senão a rotina do período para aquele dia da semana */
function dayOf(date){
  const c=doc.days[date], p=periodFor(date);
  if(c&&Array.isArray(c.b))return{date,tag:c.tag||"",b:c.b,custom:true,period:p};
  return{date,tag:(c&&c.tag)||"",b:p?p.week[wdOf(date)]:[],custom:false,period:p};
}
const examsOn=date=>doc.exams.filter(e=>e.date===date);
function stats(date){
  const day=dayOf(date), t=day.b.filter(b=>b.type!=="pausa"), n=t.length;
  const k=t.filter(b=>doc.done[date+"|"+b.id]).length;
  return{n,k,pct:n?Math.round(k/n*100):0,day};
}
/* transforma a data em dia personalizado (copiando a rotina, com os mesmos ids para manter o progresso) */
function customize(date){
  const c=doc.days[date];
  if(!c||!Array.isArray(c.b)){const d=dayOf(date);doc.days[date]={...(c||{}),b:d.b.map(b=>({...b}))}}
  return doc.days[date];
}
function uncustomize(date){
  const c=doc.days[date]; if(!c)return;
  delete c.b; if(!c.tag)delete doc.days[date];
}
function streak(){
  let n=0, d=TODAY;
  const s0=stats(d); if(!(s0.n&&s0.k===s0.n))d=addDays(d,-1);
  for(let i=0;i<400;i++){const s=stats(d);d=addDays(d,-1);if(!s.n)continue;if(s.k<s.n)break;n++}
  return n;
}

/* horários: "08:40–12:00" → [520,720]; "08:00" → [480,null]; "Manhã" → faixa aproximada */
const WORD_TIMES={"manhã":[360,720],"tarde":[780,1080],"fim da tarde":[960,1140],"noite":[1080,1380],"dia":[420,1140]};
function blockRange(t){
  const hm=[...String(t||"").matchAll(/(\d{1,2})\s*[:h]\s*(\d{2})?/g)].map(m=>+m[1]*60+(+m[2]||0)).filter(v=>v<1440);
  if(hm.length)return[hm[0],hm.length>1?hm[1]:null];
  return WORD_TIMES[String(t||"").trim().toLowerCase()]||null;
}
function timeline(day){
  const out=day.b.map(b=>({b,r:blockRange(b.t)}));
  out.forEach((x,i)=>{if(x.r&&x.r[1]==null){const nx=out.slice(i+1).find(y=>y.r);x.r=[x.r[0],nx?nx.r[0]:x.r[0]+60]}});
  return out;
}
const greeting=min=>min<300?"Boa noite":min<720?"Bom dia":min<1080?"Boa tarde":"Boa noite";

/* ===================== revisões espaçadas: D0 aula → D1 → D7 → D15 → D30 → D60 ===================== */
/* Cada etapa vence (d da etapa − d da anterior) dias depois do dia em que a anterior foi feita,
   então uma revisão atrasada empurra as seguintes em vez de amontoá-las. */
const STEPS=[
  {d:1,kind:"q",l:"Bloco de questões"},
  {d:7,kind:"q",l:"Bloco de questões"},
  {d:15,kind:"f",l:"Montar flashcards"},
  {d:30,kind:"q",l:"Bloco de questões"},
  {d:60,kind:"perf",l:"Revisão conforme desempenho"}
];
function normRev(o){
  const topics=[];
  (o&&Array.isArray(o.topics)?o.topics:[]).forEach(t=>{
    if(!t||typeof t.n!=="string"||!t.n.trim()||!validDate(t.d0))return;
    const log=(Array.isArray(t.log)?t.log:[]).filter(x=>x&&validDate(x.date)).slice(0,STEPS.length).map(x=>({
      date:x.date,pct:typeof x.pct==="number"&&x.pct>=0&&x.pct<=100?x.pct:null,did:x.did==="q"||x.did==="f"?x.did:null
    }));
    topics.push({id:typeof t.id==="string"&&ID_RE.test(t.id)?t.id:uid("r"),n:t.n.trim(),k:typeof t.k==="string"?t.k:"",d0:t.d0,log});
  });
  return{v:1,topics};
}
const revTopic=id=>doc.reviews.topics.find(t=>t.id===id);
function revDue(t){
  const i=t.log.length; if(i>=STEPS.length)return null;
  const prev=i?t.log[i-1].date:t.d0, prevD=i?STEPS[i-1].d:0;
  return addDays(prev,STEPS[i].d-prevD);
}
const stepName=i=>`D${STEPS[i].d} · ${STEPS[i].l}`;
function revAvg(t){const v=t.log.map(x=>x.pct).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
function pendingRevs(){
  return doc.reviews.topics.map(t=>({t,due:revDue(t)})).filter(x=>x.due).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:a.t.n.localeCompare(b.t.n));
}
/* próxima prova da matéria do tema, se houver uma antes da revisão */
function examBefore(t,due){
  if(!t.k)return null;
  return doc.exams.find(e=>e.k===t.k&&e.date>=TODAY&&e.date<due)||null;
}
function dueText(due){
  const n=diffDays(due,TODAY);
  if(n<0)return`<span class="late">atrasada ${-n} dia${n===-1?"":"s"}</span>`;
  if(n===0)return"hoje";
  if(n===1)return"amanhã · "+shortDate(due);
  return`em ${n} dias · ${shortDate(due)}`;
}
/* revisões ligadas a uma data: feitas (dias passados e hoje) e pendentes (hoje inclui atrasadas) */
function revOn(date){
  const out=[];
  if(date<=TODAY)doc.reviews.topics.forEach(t=>t.log.forEach((x,i)=>{if(x.date===date)out.push({t,step:i,done:true})}));
  if(date>=TODAY)pendingRevs().forEach(x=>{if(date===TODAY?x.due<=TODAY:x.due===date)out.push({t:x.t,step:x.t.log.length,done:false})});
  return out;
}

/* ===================== roteamento ===================== */
const NAV=[["dia","Hoje",IC.sun],["ia","IA",IC.spark,"Criar com IA"],["semana","Semana",IC.week],["mes","Mês",IC.month],["revisoes","Revisões",IC.rev],["planejar","Planejar",IC.plan]];
let route={v:"dia",date:TODAY};
function parseRoute(){
  const h=location.hash.replace(/^#\/?/,"").split("/"), v=h[0];
  if(v==="semana")return{v,date:validDate(h[1])?h[1]:TODAY};
  if(v==="mes")return{v,date:/^\d{4}-\d{2}$/.test(h[1]||"")&&validDate(h[1]+"-01")?h[1]+"-01":TODAY.slice(0,8)+"01"};
  if(v==="revisoes"||v==="planejar")return{v,date:TODAY};
  if(v==="ia")return{v,date:TODAY,task:AI_TASKS[h[1]]?h[1]:null};
  return{v:"dia",date:validDate(h[1])?h[1]:TODAY};
}
function hashFor(v,date){
  if(v==="dia")return date===TODAY?"#/dia":"#/dia/"+date;
  if(v==="semana")return weekStart(date)===weekStart(TODAY)?"#/semana":"#/semana/"+weekStart(date);
  if(v==="mes")return date.slice(0,7)===TODAY.slice(0,7)?"#/mes":"#/mes/"+date.slice(0,7);
  return"#/"+v;
}
function go(v,date,replace){
  const h=hashFor(v,date||TODAY);
  if(location.hash!==h){replace?history.replaceState(null,"",h):history.pushState(null,"",h)}
  route=parseRoute(); if(v!=="dia")dayEditing=null; render(true);
}
window.addEventListener("hashchange",()=>{if(!doc)return;route=parseRoute();render(true)});
function step(dir){
  const r=route;
  if(dir===0)return go(r.v,TODAY,true);
  if(r.v==="dia")go("dia",addDays(r.date,dir),true);
  else if(r.v==="semana")go("semana",addDays(weekStart(r.date),7*dir),true);
  else if(r.v==="mes"){const d=parseDate(r.date);go("mes",iso(new Date(d.getFullYear(),d.getMonth()+dir,1)),true)}
}

/* ---------- calendário (escolher data) ---------- */
const calEl=document.createElement("div");
calEl.className="calpop"; calEl.id="calpop"; calEl.hidden=true;
calEl.setAttribute("role","dialog"); calEl.setAttribute("aria-label","Calendário");
document.body.appendChild(calEl);
const calBack=document.createElement("div"); calBack.className="calback"; calBack.hidden=true; document.body.appendChild(calBack);
let cal={y:0,m:0,mode:"d",btn:null};
function openCal(btn){
  const d=parseDate(route.date);
  cal={y:d.getFullYear(),m:d.getMonth(),mode:route.v==="mes"?"m":"d",btn};
  calEl.hidden=false; calBack.hidden=false; btn.setAttribute("aria-expanded","true");
  renderCal(); placeCal();
  const f=calEl.querySelector(".sel")||calEl.querySelector(".today")||calEl.querySelector("button");
  if(f)f.focus({preventScroll:true});
}
function closeCal(back){
  if(calEl.hidden)return;
  calEl.hidden=true; calBack.hidden=true;
  if(cal.btn){cal.btn.setAttribute("aria-expanded","false");if(back&&document.contains(cal.btn))cal.btn.focus({preventScroll:true})}
}
function placeCal(){
  if(matchMedia("(max-width:640px)").matches){calEl.style.left=calEl.style.top="";calEl.classList.add("sheet");return}
  calEl.classList.remove("sheet");
  const r=cal.btn.getBoundingClientRect(), w=calEl.offsetWidth;
  calEl.style.left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2))+"px";
  calEl.style.top=(r.bottom+window.scrollY+8)+"px";
}
function renderCal(){
  const sel=route.date, v=route.v, mm=cal.m, yy=cal.y;
  let h;
  if(cal.mode==="m"){
    const curM=sel.slice(0,7);
    h=`<div class="cp-h"><button class="ib" type="button" data-cp="y-1" aria-label="Ano anterior">${IC.chevL}</button><b>${yy}</b><button class="ib" type="button" data-cp="y1" aria-label="Próximo ano">${IC.chevR}</button></div>
    <div class="cp-mg">${MONTHS.map((n,i)=>{const k=`${yy}-${String(i+1).padStart(2,"0")}`, ex=doc.exams.some(e=>e.date.startsWith(k));
      return`<button type="button" data-cpm="${i}" class="${k===curM&&v==="mes"?"sel":""}${k===TODAY.slice(0,7)?" today":""}">${cap(n.slice(0,3))}${ex?`<i class="dot" title="Tem prova"></i>`:""}</button>`}).join("")}</div>`;
  }else{
    const first=iso(new Date(yy,mm,1)), last=iso(new Date(yy,mm+1,0)), gs=weekStart(first), ge=addDays(weekStart(last),6);
    const selW=v==="semana"?weekStart(sel):null;
    let g="";
    for(let d=gs;d<=ge;d=addDays(d,1)){
      const inM=d>=first&&d<=last, ex=examsOn(d).length, st=stats(d);
      const c=[]; if(!inM)c.push("out"); if(d===TODAY)c.push("today");
      if(selW?weekStart(d)===selW:d===sel)c.push("sel");
      if(selW&&weekStart(d)===selW){if(d===selW)c.push("ws");if(d===addDays(selW,6))c.push("we")}
      if(st.n&&st.k===st.n)c.push("full");
      g+=`<button type="button" data-cpd="${d}" class="${c.join(" ")}" aria-label="${esc(cap(longDate(d)))}${ex?", prova":""}"${d===sel?' aria-current="date"':""}>${parseDate(d).getDate()}${ex?`<i class="dot"></i>`:""}</button>`;
    }
    h=`<div class="cp-h"><button class="ib" type="button" data-cp="m-1" aria-label="Mês anterior">${IC.chevL}</button><button class="cp-t" type="button" data-cp="mode" title="Escolher mês e ano">${cap(MONTHS[mm])} ${yy}${IC.chevD}</button><button class="ib" type="button" data-cp="m1" aria-label="Próximo mês">${IC.chevR}</button></div>
    <div class="cp-wd" aria-hidden="true">${ORDER.map(i=>`<span>${WD[i]}</span>`).join("")}</div><div class="cp-g${selW?" wk":""}">${g}</div>`;
  }
  h+=`<div class="cp-f"><span class="cp-leg"><i class="dot"></i>prova</span><span class="spacer"></span><button class="btn sm" type="button" data-cp="today">Hoje</button><button class="btn sm" type="button" data-cp="close">Fechar</button></div>`;
  calEl.innerHTML=h;
}
calEl.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.cpd){closeCal();return go(route.v==="semana"?"semana":"dia",b.dataset.cpd,true)}
  if(b.dataset.cpm!=null){
    const m=+b.dataset.cpm;
    if(route.v==="mes"){closeCal();return go("mes",iso(new Date(cal.y,m,1)),true)}
    cal.m=m; cal.mode="d"; return renderCal();
  }
  const a=b.dataset.cp;
  if(a==="close")return closeCal(true);
  if(a==="today"){closeCal();return step(0)}
  if(a==="mode"){cal.mode="m";return renderCal()}
  if(a==="y-1"||a==="y1"){cal.y+=a==="y1"?1:-1;return renderCal()}
  if(a==="m-1"||a==="m1"){const d=new Date(cal.y,cal.m+(a==="m1"?1:-1),1);cal.y=d.getFullYear();cal.m=d.getMonth();return renderCal()}
});
calEl.addEventListener("keydown",e=>{
  if(e.key==="Escape"){e.stopPropagation();return closeCal(true)}
  const b=e.target.closest("[data-cpd]");
  const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
  if(b&&mv){
    e.preventDefault();
    const nd=addDays(b.dataset.cpd,mv), d=parseDate(nd);
    if(d.getMonth()!==cal.m||d.getFullYear()!==cal.y){cal.y=d.getFullYear();cal.m=d.getMonth();renderCal()}
    const t=calEl.querySelector(`[data-cpd="${nd}"]`); if(t)t.focus();
  }
});

/* ---------- vista: dia ---------- */
function viewDay(date){
  const isT=date===TODAY;
  const now=isT?nowHTML():""; if(!isT){curBlockId=null;nowBlock=null}
  const day=dayOf(date), y=parseDate(date).getFullYear();
  const sub=[String(y)];
  if(day.custom)sub.push("dia personalizado");else if(day.period)sub.push("rotina: "+esc(day.period.name));
  let h=vnav({title:cap(longDate(date)),rel:relLabel(date),sub:sub.join(" · "),date,prev:"Dia anterior",next:"Próximo dia",todayL:"Hoje",pickL:"Escolher dia",atToday:isT});
  if(isEmptyPlan())h+=`<a class="ai-promo card" href="#/ia/tudo"><span class="ai-ic">${IC.spark}</span><span class="tx"><b>Seu cronograma está vazio</b><small>Monte o ano inteiro em poucos minutos com uma IA: ela faz perguntas e o app importa a resposta.</small></span><span class="btn accent sm">Começar</span></a>`;
  h+=strip(date);
  h+=`<div class="dgrid${isT?"":" nonow"}">`;
  if(isT)h+=`<div class="g-now">${now}</div>`;
  h+=`<div class="g-card">${dayCard(date,day)}</div><aside class="g-side" aria-label="Resumo">${examsCard()}${pastCard()}${revCard()}${notesCard()}</aside></div>`;
  return h;
}
function strip(date){
  const ws=weekStart(date);
  return`<nav class="wstrip" aria-label="Dias da semana">`+[0,1,2,3,4,5,6].map(i=>{
    const d=addDays(ws,i), s=stats(d), ex=examsOn(d).length, past=d<TODAY;
    const cls=["wd"];
    if(d===TODAY)cls.push("today"); if(d===date)cls.push("sel");
    if(s.n&&s.k===s.n)cls.push("full");else if(past&&s.k<s.n)cls.push("late");
    const lab=`${cap(longDate(d))}${ex?", prova":""}${s.n?`, ${s.pct}% concluído`:""}`;
    return`<a class="${cls.join(" ")}" href="${hashFor("dia",d)}" data-fk="wd${d}" aria-label="${esc(lab)}"${d===date?' aria-current="date"':""}>${ex?'<span class="xd"></span>':""}<span class="w">${d===TODAY?"Hoje":WD[wdOf(d)]}</span><span class="n">${parseDate(d).getDate()}</span><span class="bar">${s.n?`<i style="width:${s.pct}%"></i>`:""}</span></a>`;
  }).join("")+`</nav>`;
}
function nowHTML(){
  const min=nowMinutes(), day=dayOf(TODAY), tl=timeline(day), st=stats(TODAY), ex=examsOn(TODAY);
  const open=x=>x.b.type!=="pausa"&&!doc.done[TODAY+"|"+x.b.id];
  const inNow=x=>x.r&&x.r[0]<=min&&min<x.r[1];
  const cur=tl.find(x=>open(x)&&inNow(x)), pause=tl.find(x=>x.b.type==="pausa"&&inNow(x));
  const next=tl.find(x=>open(x)&&x.r&&x.r[0]>min), any=tl.find(open), f=cur||next||any;
  nowBlock=f?f.b:null; curBlockId=cur?cur.b.id:null;
  const nm=(account.name||"").split(/\s+/)[0];
  let lab,what,det;
  if(f){lab=cur?"Agora":pause&&next?`${pause.b.d} · depois`:next?"A seguir":"Pendente de hoje";what=f.b.l;det=[f.b.t,f.b.d].filter(Boolean).join(" · ")}
  else if(st.n){lab="Hoje";what="Dia concluído!";det="Todos os blocos de hoje foram marcados. Hora de descansar."}
  else{lab="Hoje";what=ex.length?"Dia de prova":"Dia livre";det=ex.length?"Boa prova! Nenhum bloco de estudo planejado.":"Nenhum bloco de estudo planejado para hoje."}
  const exl=ex.map(e=>`<div class="nex">${IC.flag}<span>Prova hoje: ${esc(e.l)}${subj(e.k)?" · "+esc(subj(e.k).n):""}${e.t?" · "+esc(e.t):""}</span></div>`).join("");
  lastNow=`${what}|${det}|${lab}|${curBlockId}|${greeting(min)}`;
  return`<section class="now" aria-label="Agora">
    <div class="top2"><span>${esc(greeting(min)+(nm?", "+nm:""))}!</span>${day.tag?`<span class="pill">${esc(day.tag)}</span>`:""}</div>
    ${exl}
    <div><div class="lab">${esc(lab)}</div><div class="what">${esc(what)}</div>${det?`<div class="det">${esc(det)}</div>`:""}</div>
    ${st.n?`<div class="meter"><span class="track" aria-hidden="true"><i style="width:${st.pct}%"></i></span><span>${st.k} de ${st.n} hoje</span></div>`:""}
    ${nowBlock?`<button class="btn" type="button" data-act="now-done" data-fk="now-done">${IC.check}Marcar como concluído</button>`:""}
  </section>`;
}
function blockLI(b,i,n,o){
  const col=b.type==="pausa"?"fixo":colorOf(b.k);
  const tools=o.ed?`<span class="tools"><button class="ib" type="button" data-act="${o.pre}-up" data-id="${b.id}" data-fk="u${b.id}" aria-label="Mover para cima"${i===0?" disabled":""}>${IC.up}</button><button class="ib" type="button" data-act="${o.pre}-down" data-id="${b.id}" data-fk="d${b.id}" aria-label="Mover para baixo"${i===n-1?" disabled":""}>${IC.down}</button><button class="ib" type="button" data-act="${o.pre}-edit" data-id="${b.id}" data-fk="e${b.id}" aria-label="Editar bloco">${IC.edit}</button></span>`:"";
  if(b.type==="pausa")return`<li class="blk pause"><div class="row"><span></span><span class="t">${esc(b.t)}</span><span class="c">${esc(b.d)}</span></div>${tools}</li>`;
  const inner=`<span class="t">${esc(b.t||"—")}</span><span class="c"><span class="lbl">${esc(b.l)}</span>${b.d?`<span class="d">${esc(b.d)}</span>`:""}</span>`;
  if(!o.date)return`<li class="blk" style="--k:var(--${col})"><div class="row"><span class="dotk"></span>${inner}</div>${tools}</li>`;
  const k=o.date+"|"+b.id, on=!!doc.done[k];
  return`<li class="blk${on?" done":""}${b.id===o.cur?" current":""}" style="--k:var(--${col})"><label class="row"><input type="checkbox" data-done="${k}" data-fk="c${k}"${on?" checked":""}>${inner}</label>${tools}</li>`;
}
function dayCard(date,day){
  const st=stats(date), ex=examsOn(date), ed=dayEditing===date, complete=st.n>0&&st.k===st.n;
  const badges=[];
  if(ex.length)badges.push(`<span class="badge exam">Prova</span>`);
  if(complete)badges.push(`<span class="badge ok">Concluído</span>`);
  if(date<TODAY&&st.k<st.n)badges.push(`<span class="badge soft">${st.n-st.k} pendente${st.n-st.k>1?"s":""}</span>`);
  const title=day.tag||(ex.length?ex[0].l+(subj(ex[0].k)?" de "+subj(ex[0].k).n:""):day.custom?"Dia personalizado":day.period?"Rotina de "+WDF[wdOf(date)]:"Sem rotina");
  let h=`<article class="dcard card${complete?" complete":""}${ex.length?" examday":""}${ed?" editing":""}" aria-label="Blocos do dia">
    <header class="dch"><div class="dch-t"><h2>${esc(title)}</h2>${badges.join("")}</div>
    <button class="btn sm${ed?" primary":""}" type="button" data-act="day-edit" data-fk="day-edit" aria-pressed="${ed}">${ed?IC.check+"Concluir":IC.edit+"Editar dia"}</button></header>`;
  if(ed){
    const wd=wdOf(date);
    const msg=day.custom?`<b>Dia personalizado.</b> As mudanças valem só para ${esc(shortDate(date))}.`
      :day.period?`Este dia segue a rotina <b>${esc(day.period.name)}</b> das ${WDP[wd]}. O que você mudar aqui vale só para ${esc(shortDate(date))}; para mudar todas as ${WDP[wd]}, use <a href="#/planejar">Planejar</a>.`
      :`Nenhuma rotina cobre esta data. Os blocos que você adicionar valem só para este dia; para criar uma rotina, use <a href="#/planejar">Planejar</a>.`;
    h+=`<div class="edit-note"><span>${msg}</span><div class="row2"><button class="btn sm" type="button" data-act="day-tag">${IC.edit}Legenda do dia</button><button class="btn sm" type="button" data-act="exam-add" data-date="${date}">${IC.flag}Adicionar prova</button>${day.custom?`<button class="btn sm danger" type="button" data-act="day-reset">Voltar à rotina</button>`:""}</div></div>`;
  }
  ex.forEach(e=>{
    const s=subj(e.k);
    h+=`<div class="exb"><span class="exi">${IC.flag}</span><div class="ext"><b>${esc(e.l)}${s?" · "+esc(s.n):""}</b>${e.t||e.d?`<span>${esc([e.t,e.d].filter(Boolean).join(" · "))}</span>`:""}</div><button class="ib" type="button" data-act="exam-edit" data-id="${e.id}" aria-label="Editar prova">${IC.edit}</button></div>`;
  });
  if(day.b.length)h+=`<ul class="blocks">${day.b.map((b,i)=>blockLI(b,i,day.b.length,{date,ed,pre:"blk",cur:date===TODAY?curBlockId:null})).join("")}</ul>`;
  else if(!ed)h+=`<div class="dempty"><p><b>${ex.length?"Nenhum bloco de estudo neste dia.":"Nada planejado para este dia."}</b> ${day.period?`A rotina das ${WDP[wdOf(date)]} está vazia.`:"Nenhum período de rotina cobre esta data."}</p><div class="row2"><button class="btn sm" type="button" data-act="blk-add">${IC.plus}Bloco só neste dia</button><a class="btn sm" href="#/planejar">${IC.plan}Editar rotina</a><a class="btn sm accent" href="#/ia">${IC.spark}Criar com IA</a></div></div>`;
  if(ed)h+=`<button class="addblk" type="button" data-act="blk-add" data-fk="blk-add">+ Adicionar bloco</button>`;
  const rv=revOn(date);
  if(rv.length)h+=`<div class="revday"><span class="lbl2">Revisões:</span>${rv.map(x=>x.done
    ?`<span class="btn chip on" style="--k:var(--${colorOf(x.t.k)})">${IC.check}${esc(x.t.n)} · D${STEPS[x.step].d}</span>`
    :`<button class="btn chip" type="button" data-act="rev-done" data-id="${x.t.id}" data-fk="r${x.t.id}" style="--k:var(--${colorOf(x.t.k)})" aria-label="Registrar ${esc(stepName(x.step))} de ${esc(x.t.n)}"><i class="sw" aria-hidden="true"></i>${esc(x.t.n)} · D${STEPS[x.step].d}</button>`).join("")}</div>`;
  if(st.n)h+=`<footer class="dprog"><span>${st.k}/${st.n} blocos</span><span class="track" aria-hidden="true"><i style="width:${st.pct}%"></i></span><b>${st.pct}%</b></footer>`;
  return h+`</article>`;
}

function pastCard(){
  const ds=[6,5,4,3,2,1,0].map(i=>addDays(TODAY,-i));
  let pend=0, first=null;
  for(let i=7;i>=1;i--){const d=addDays(TODAY,-i), s=stats(d);if(s.k<s.n){pend+=s.n-s.k;if(!first)first=d}}
  const sk=streak();
  const bars=ds.map(d=>{
    const s=stats(d), cls=[];
    if(!s.n)cls.push("none");else if(s.k===s.n)cls.push("full");else if(d<TODAY)cls.push("late");
    if(d===TODAY)cls.push("today");
    return`<a class="${cls.join(" ")}" href="${hashFor("dia",d)}" aria-label="${esc(cap(longDate(d)))}: ${s.n?s.pct+"% concluído":"sem blocos"}"><span class="p">${s.n?s.pct+"%":"–"}</span><span class="col">${s.n?`<i style="height:${Math.max(s.pct,4)}%"></i>`:""}</span><span>${d===TODAY?"Hoje":WD[wdOf(d)]}</span></a>`;

  return`<section class="card scard"><h2>Últimos 7 dias</h2><div class="bars">${bars}</div>
    <div class="kpis"><div class="kpi ok"><b>${sk}</b><span>${sk===1?"dia completo seguido":"dias completos seguidos"}</span></div>
    ${first?`<a class="kpi warn" href="${hashFor("dia",first)}"><b>${pend}</b><span>${pend===1?"bloco pendente":"blocos pendentes"} · ver</span></a>`:`<div class="kpi ok"><b>0</b><span>pendências na semana</span></div>`}</div></section>`;
}

function notesCard(){
  if(!doc.notes.length)return"";
  return`<section class="card scard"><details class="nts"><summary>Como estudar</summary><div class="notes">${doc.notes.map(n=>`<div class="note"><h3>${esc(n.h)}</h3>${noteBody(n.t)}</div>`).join("")}</div></details></section>`;

/* anotações: linhas começando com "- " viram lista */
function noteBody(t){
  let html="", list=[];
  const flush=()=>{if(list.length){html+="<ul>"+list.map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>";list=[]}};
  String(t).split("\n").forEach(line=>{
    const s=line.trim(); if(!s){flush();return}
    const m=s.match(/^[-•*]\s+(.*)/);
    if(m)list.push(m[1]);else{flush();html+=`<p>${esc(s)}</p>`}
  });
  flush(); return html;
}

/* ---------- vista: semana ---------- */
function viewWeek(date){
  const ws=weekStart(date), ds=[0,1,2,3,4,5,6].map(i=>addDays(ws,i)), we=ds[6];
  const a=parseDate(ws), b=parseDate(we), cur=ws===weekStart(TODAY);
  const title=a.getMonth()===b.getMonth()?`${a.getDate()} a ${b.getDate()} de ${MONTHS[b.getMonth()]}`:`${a.getDate()} de ${MONTHS[a.getMonth()]} a ${b.getDate()} de ${MONTHS[b.getMonth()]}`;
  const dw=diffDays(ws,weekStart(TODAY))/7;
  const rel=cur?"Esta semana":dw===1?"Próxima semana":dw===-1?"Semana passada":dw>0?`Daqui a ${dw} semanas`:`Há ${-dw} semanas`;
  let n=0,k=0,nex=0;
  ds.forEach(d=>{const s=stats(d);n+=s.n;k+=s.k;nex+=examsOn(d).length});
  let h=vnav({title,rel,sub:String(b.getFullYear()),date:ws,prev:"Semana anterior",next:"Próxima semana",pickL:"Escolher semana",todayL:"Esta semana",atToday:cur});
  h+=`<div class="wsum"><span class="pillk"><b>${n?Math.round(k/n*100):0}%</b> concluído</span><span class="pillk"><b>${k}</b> de ${n} blocos</span>${nex?`<span class="pillk exam"><b>${nex}</b> prova${nex>1?"s":""}</span>`:""}</div>`;
  h+=`<div class="wgrid">${ds.map(weekCol).join("")}</div>`;
  return h;
}
function weekCol(date){
  const day=dayOf(date), s=stats(date), ex=examsOn(date), d=parseDate(date);
  const cls=["wcol","card"];
  if(date===TODAY)cls.push("today"); if(ex.length)cls.push("examday"); if(s.n&&s.k===s.n)cls.push("full");
  const pc=s.n?(s.k===s.n?`<span class="pc ok">✓ feito</span>`:`<span class="pc${date<TODAY?" late":""}">${s.pct}%</span>`):"";
  const items=day.b.map(b=>{
    if(b.type==="pausa")return`<li class="cb pause"><span class="t">${esc(b.t)}</span> ${esc(b.d)}</li>`;
    const key=date+"|"+b.id, on=!!doc.done[key];
    return`<li class="cb${on?" done":""}" style="--k:var(--${colorOf(b.k)})"><label><input type="checkbox" data-done="${key}" data-fk="c${key}"${on?" checked":""}><span><span class="t">${esc(b.t)}</span><span class="l">${esc(b.l)}</span></span></label></li>`;
  }).join("");
  return`<section class="${cls.join(" ")}" aria-label="${esc(cap(longDate(date)))}">
    <a class="wh" href="${hashFor("dia",date)}"><span class="dn">${date===TODAY?"Hoje":WD[d.getDay()]}<small>${d.getDate()}/${pad(d.getMonth()+1)}</small></span>${pc}</a>
    ${day.tag?`<div class="wtag">${esc(day.tag)}</div>`:""}
    ${ex.map(e=>`<a class="wex" href="${hashFor("dia",date)}">${IC.flag}${esc(e.l)}${subj(e.k)?" · "+esc(subj(e.k).n):""}</a>`).join("")}
    ${items?`<ul class="cbl">${items}</ul>`:ex.length?"":`<p class="wempty">Livre</p>`}
    <div class="wbar"><i style="width:${s.pct}%"></i></div></section>`;
}

/* ---------- vista: mês ---------- */
function viewMonth(date){
  const y=+date.slice(0,4), m=+date.slice(5,7)-1;
  const first=iso(new Date(y,m,1)), last=iso(new Date(y,m+1,0));
  const gs=weekStart(first), ge=addDays(weekStart(last),6);
  const cur=TODAY.slice(0,7)===first.slice(0,7);
  const pend=pendingRevs(), revN={};
  pend.forEach(x=>{const d=x.due<TODAY?TODAY:x.due;revN[d]=(revN[d]||0)+1});
  let cells="", n=0, k=0;
  const exs=[];
  for(let d=gs;d<=ge;d=addDays(d,1)){
    const s=stats(d), ex=examsOn(d), inM=d>=first&&d<=last, dd=parseDate(d).getDate();
    if(inM){if(d<=TODAY){n+=s.n;k+=s.k}exs.push(...ex)}
    const cls=["mc"];
    if(!inM)cls.push("out"); if(d===TODAY)cls.push("today");
    if(s.n&&s.k===s.n)cls.push("full");else if(d<TODAY&&s.k<s.n)cls.push("late");
    const lab=`${cap(longDate(d))}${ex.length?", "+ex.map(e=>e.l).join(", "):""}${s.n?`, ${s.k} de ${s.n} blocos`:""}`;
    cells+=`<a class="${cls.join(" ")}" href="${hashFor("dia",d)}" aria-label="${esc(lab)}" data-fk="m${d}"><span class="n">${dd}</span>${ex.map(e=>`<span class="ex">${esc(e.l)}${subj(e.k)?" · "+esc(subj(e.k).n):""}</span>`).join("")}${!ex.length&&s.day.tag?`<span class="tg">${esc(s.day.tag)}</span>`:""}${revN[d]&&d>=TODAY?`<span class="rv">${revN[d]} revis${revN[d]>1?"ões":"ão"}</span>`:""}${s.n?`<span class="pb"><i style="width:${s.pct}%"></i></span>`:""}</a>`;
  }
  let h=vnav({title:cap(MONTHS[m]),rel:cur?"Este mês":"",sub:String(y),date:first,prev:"Mês anterior",next:"Próximo mês",pickL:"Escolher mês",todayL:"Este mês",atToday:cur});
  h+=`<div class="wsum"><span class="pillk"><b>${n?Math.round(k/n*100):0}%</b> concluído ${cur?"até hoje":first>TODAY?"(mês futuro)":"no mês"}</span><span class="pillk"><b>${k}</b> de ${n} blocos</span>${exs.length?`<span class="pillk exam"><b>${exs.length}</b> prova${exs.length>1?"s":""}</span>`:""}</div>`;
  h+=`<section class="card mwrap" aria-label="Calendário de ${MONTHS[m]}"><div class="mhd" aria-hidden="true">${ORDER.map(i=>`<span>${WD[i]}</span>`).join("")}</div><div class="mgrid">${cells}</div>
    <div class="mleg"><span><i style="background:var(--ok)"></i>Dia completo</span><span><i style="background:var(--accent)"></i>Em andamento</span><span><i style="background:var(--warn)"></i>Com pendências</span><span><i style="background:var(--prova);width:8px;height:8px;border-radius:50%"></i>Prova</span></div></section>`;
  if(exs.length)h+=`<section class="card scard"><h2>Provas de ${MONTHS[m]}</h2><ul class="mlist">${exs.map(e=>{const s=subj(e.k);return`<li class="pli" style="--k:var(--prova)"><a class="tx" href="${hashFor("dia",e.date)}"><b>${esc(e.l)}${s?" · "+esc(s.n):""}</b><small>${esc(shortDate(e.date))}${e.t?" · "+esc(e.t):""}${e.d?" · "+esc(e.d):""}</small></a></li>`}).join("")}</ul></section>`;
  return h;
}

/* ---------- vista: revisões ---------- */
function revItem(t,mode){
  const due=revDue(t), i=t.log.length, avg=revAvg(t), s=subj(t.k), meta=[];
  if(s)meta.push(esc(s.n));
  if(due){
    meta.push(`${esc(stepName(i))} · ${dueText(due)}`);
    const ex=examBefore(t,due);

const dlg=$("dlg"), form=$("dlg-form");

function updateVis(){

}
function showErr(id,msg){const e=$(id);e.textContent=msg||"";e.hidden=!msg}
function openForm(cfg){

      const g=document.createElement("div"); g.className="checks";
      f.options.forEach(([v,t])=>{const l=document.createElement("label");const i=document.createElement("input");i.type="checkbox";i.value=v;if((f.value||[]).includes(v))i.checked=true;l.append(i,document.createTextNode(t));g.appendChild(l)});

/* confirmação em dois cliques (sem diálogo do navegador) */
function twoStep(btn,lab,idle,ask,fn){
  let tm=0;
  const off=()=>{clearTimeout(tm);btn.classList.remove("armed");lab.textContent=typeof idle==="function"?idle():idle};
  btn.addEventListener("click",()=>{
    if(!btn.classList.contains("armed")){btn.classList.add("armed");lab.textContent=ask;tm=setTimeout(off,4000);return}
    off(); fn();
  });
  btn.addEventListener("blur",off);
  return off;
}

});

/* alvo: {kind:"day",date} (vale só para a data) ou {kind:"rot",pid,wd} (rotina do período) */
function listOf(tg,write){
  if(tg.kind==="day")return write?customize(tg.date).b:dayOf(tg.date).b;
  const p=doc.periods.find(x=>x.id===tg.pid); return p?p.week[tg.wd]:[];
}
function splitTime(t){
  t=String(t||"").trim();
  let m=t.match(/^(\d{1,2}):(\d{2})\s*[–—-]\s*(\d{1,2}):(\d{2})$/);
  if(m)return{s:pad(m[1])+":"+m[2],e:pad(m[3])+":"+m[4],tx:""};
  m=t.match(/^(\d{1,2}):(\d{2})$/);
  if(m)return{s:pad(m[1])+":"+m[2],e:"",tx:""};
  return{s:"",e:"",tx:t};
}
/* coloca o bloco na posição certa pelo horário de início */
function placeBlock(L,nb,oldIdx){
  if(oldIdx>=0)L.splice(oldIdx,1);
  const s=blockStart(nb.t);
  let at=oldIdx>=0?oldIdx:L.length;
  if(s!=null){at=L.findIndex(b=>{const x=blockStart(b.t);return x!=null&&x>s});if(at<0)at=L.length}
  L.splice(at,0,nb);
}
