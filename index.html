function reviewDone(t){
  const i=t.log.length, st=STEPS[i]; if(!st)return;
  const prev=i?t.log[i-1].date:t.d0, avg=revAvg(t), fields=[];
  if(st.kind==="perf")fields.push({name:"did",label:"Como você acha que está neste tema?",type:"select",value:"q",
    options:[["q","Acho que estou mal → fiz um bloco de questões"],["f","Acho que estou bem → revisei com flashcards"]],
    hint:avg!=null?`Sua média de acertos neste tema: ${avg}% (${t.log.filter(x=>x.pct!=null).map(x=>x.pct+"%").join(", ")}).`:"Nenhum % de acertos registrado nas revisões anteriores."});
  fields.push({name:"pct",label:"Acertos (%)",type:"number",half:true,placeholder:"opcional",showIf:v=>st.kind==="q"||(st.kind==="perf"&&v.did==="q")});
  fields.push({name:"date",label:"Feita em",type:"date",half:true,value:TODAY<prev?prev:TODAY});
  openForm({
    title:`${t.n} · ${stepName(i)}`, saved:"Revisão registrada", fields, ok:"Registrar",
    onSave(v){
      if(!validDate(v.date))return"Escolha uma data válida.";
      if(v.date<prev)return`A data não pode ser antes de ${shortDate(prev)} (${i?"revisão anterior":"dia da aula"}).`;
      if(v.date>TODAY)return"A data não pode estar no futuro.";
      let pct=null;
      if(v.pct!=null&&String(v.pct).trim()!==""){
        pct=Number(String(v.pct).replace(",","."));
        if(!isFinite(pct)||pct<0||pct>100)return"O % de acertos vai de 0 a 100.";
        pct=Math.round(pct);
      }
      t.log.push({date:v.date,pct,did:st.kind==="perf"?v.did:st.kind});
      const nd=revDue(t);
      this.saved=nd?`D${st.d} feita · D${STEPS[i+1].d} ${nd===TODAY?"hoje":shortDate(nd)}`:`Ciclo de ${t.n} concluído!`;
    }
  });
}

/* ===================== backup e importação ===================== */
function download(name,text){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
/* aceita JSON puro, dentro de ```json ... ``` ou com texto em volta */
function parseLoose(text){
  let t=String(text).trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence)t=fence[1].trim();
  try{return JSON.parse(t)}catch(e){}
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0&&b>a)return JSON.parse(t.slice(a,b+1));
  throw new Error("json");
}
const hasPlan=d=>d.periods.length||Object.keys(d.days).length||d.exams.length;
/* nada planejado de fato (conta nova em branco) */
const isEmptyPlan=()=>!doc.exams.length&&!Object.keys(doc.days).length&&doc.periods.every(p=>p.week.every(l=>!l.length));
function mergeInto(d){
  d.subjects.forEach(s=>{if(!subj(s.k))doc.subjects.push(s)});
  doc.periods.push(...d.periods);
  Object.entries(d.days).forEach(([date,x])=>{
    const ex=doc.days[date];
    if(!ex)doc.days[date]=x;
    else{if(!ex.tag&&x.tag)ex.tag=x.tag;if(x.b){if(!Array.isArray(ex.b))customize(date);doc.days[date].b.push(...x.b)}}
  });
  doc.exams.push(...d.exams); doc.exams.sort(byExam);
  doc.notes.push(...d.notes);
}
/* backup deste site (v2 ou da versão antiga) ou planejamento gerado por IA. Devolve mensagem de erro ou null */
function importObject(o,mode){
  let d, full=false;
  if(o&&o.app==="cronograma"&&o.doc){d=normDoc(o.doc);full=true}
  else if(o&&o.app==="cronograma-provas"&&o.data){d=fromV1(o.data,o.progress,o.reviews);full=true}
  else d=normDoc(o,true);
  if(!hasPlan(d))return"Não encontrei rotina, dias nem provas válidos. Confira se o JSON tem \"periods\", \"days\" ou \"exams\" com datas no formato AAAA-MM-DD.";
  if(mode==="merge"){
    mergeInto(d);
    if(full){Object.assign(doc.done,d.done);d.reviews.topics.forEach(t=>{if(!revTopic(t.id))doc.reviews.topics.push(t)})}
  }else if(full){d.profile=doc.profile;doc=d}
  else{doc.subjects=d.subjects;doc.periods=d.periods;doc.days=d.days;doc.exams=d.exams;if(d.notes.length)doc.notes=d.notes}
  planPid=null; dayEditing=null;
  const nd=Object.keys(d.days).length;
  persist(); go("dia",TODAY,true);
  toast(`${mode==="merge"?"Adicionado":"Importado"}: ${d.periods.length} período${d.periods.length===1?"":"s"}, ${nd} dia${nd===1?"":"s"} personalizado${nd===1?"":"s"}, ${d.exams.length} prova${d.exams.length===1?"":"s"}`);
  return null;
}
function exportBackup(){
  download(`cronograma-${account.user}-${iso(new Date())}.json`,JSON.stringify({app:"cronograma",v:2,exportado:new Date().toISOString(),usuario:account.user,doc},null,2));
  toast("Backup exportado");
}
$("file-import").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f)return;
  let o; try{o=parseLoose(await f.text())}catch(err){return toast("Arquivo inválido: não é um JSON do cronograma")}

    onSave(v){const r=importObject(o,v.mode);if(r)return r}
  });
});

/* aceita um ou vários blocos ```json``` (respostas em partes) ou JSON solto */
function aiParseText(text){
  const blocks=[...String(text).matchAll(/```(?:json|JSON)?\s*([\s\S]*?)```/g)].map(m=>m[1].trim()).filter(Boolean);
  if(blocks.length<2)return parseLoose(text);
  const out={};
  blocks.forEach(b=>{
    const o=parseLoose(b);
    Object.entries(o||{}).forEach(([k,v])=>{
      if(Array.isArray(v))out[k]=(Array.isArray(out[k])?out[k]:[]).concat(v);
      else if(k==="reviews"&&v&&Array.isArray(v.topics))out[k]=(Array.isArray(out[k])?out[k]:[]).concat(v.topics);
      else if(out[k]===undefined)out[k]=v;
    });
  });
  return out;
}
function jsonErr(e){

  return m?` (o problema está perto do caractere ${m[1]})`:"";

  if(o.app==="cronograma"||o.app==="cronograma-provas")return{backup:true,o};
  const rev=Array.isArray(o.reviews)?o.reviews:o.reviews&&Array.isArray(o.reviews.topics)?o.reviews.topics:null;
  const d=normDoc({...o,reviews:{topics:rev||[]}},!t.keepIds);
  const reset=(Array.isArray(o.days_reset)?o.days_reset:[]).filter(validDate);
  const has={subjects:Array.isArray(o.subjects),periods:Array.isArray(o.periods),days:Array.isArray(o.days)||!!(o.days&&typeof o.days==="object"),
    days_reset:Array.isArray(o.days_reset),exams:Array.isArray(o.exams)||d.exams.length>0,reviews:!!rev,notes:Array.isArray(o.notes)};
  const aiK=new Set((Array.isArray(o.subjects)?o.subjects:[]).map(x=>x&&x.k).filter(k=>typeof k==="string"));
  const n={subjects:d.subjects.filter(x=>aiK.has(x.k)).length,periods:d.periods.length,days:Object.keys(d.days).length,days_reset:reset.length,exams:d.exams.length,reviews:d.reviews.topics.length,notes:d.notes.length};
  const warn=[];
  const lost=(k,got)=>{const a=Array.isArray(o[k])?o[k].length:0;if(a>got)warn.push(`${a-got} ${a-got===1?AI_SEC[k].one:AI_SEC[k].many} sem data válida (AAAA-MM-DD) ${a-got===1?"foi ignorado(a)":"foram ignorados(as)"}.`)};
  lost("periods",n.periods); if(Array.isArray(o.days))lost("days",n.days); lost("reviews",n.reviews);
  const unk=d.subjects.filter(x=>!aiK.has(x.k)&&!subj(x.k)).map(x=>x.k);
  if(unk.length)warn.push(`Matéria${unk.length>1?"s":""} sem cadastro: ${unk.join(", ")}. ${unk.length>1?"Serão criadas":"Será criada"} com esse nome; dá para renomear depois em Planejar.`);
  const extra=Object.keys(o).filter(k=>!AI_ORDER.includes(k));
  if(extra.length)warn.push("Chaves ignoradas: "+extra.join(", ")+".");
  const total=AI_ORDER.reduce((a,k)=>a+n[k],0);
  if(!total)return{err:"Não encontrei nada para importar. O JSON precisa ter pelo menos uma destas chaves preenchidas: "+t.keys.join(", ")+"."};
  return{o,d,n,has,reset,aiK,warn};
}
/* matérias usadas por algum item do planejamento */
function usedKs(){
  const u=new Set(), add=b=>{if(b.k)u.add(b.k)};
  doc.periods.forEach(p=>p.week.forEach(l=>l.forEach(add)));
  Object.values(doc.days).forEach(x=>(x.b||[]).forEach(add));
  doc.exams.forEach(add); doc.reviews.topics.forEach(add);
  return u;
}
function aiApply(c,id,mode){
  const t=AI_TASKS[id], d=c.d, rep=mode==="replace";
  const R=k=>rep&&t.keys.includes(k)&&c.has[k];
  const snap=JSON.stringify(doc);
  const lc=s=>String(s||"").trim().toLowerCase();
  /* matérias: novas entram; as que a IA mandou atualizam nome e cor */
  d.subjects.forEach(s=>{const ex=subj(s.k);if(!ex)doc.subjects.push(s);else if(c.aiK.has(s.k)){ex.n=s.n;ex.c=s.c}});
  if(c.has.periods)doc.periods=R("periods")?d.periods:doc.periods.concat(d.periods);
  if(c.has.days){
    if(R("days")&&t.wipeDays)doc.days={};
    Object.entries(d.days).forEach(([date,x])=>{doc.days[date]=Array.isArray(x.b)?x:{...(doc.days[date]||{}),tag:x.tag}});
  }
  c.reset.forEach(date=>{delete doc.days[date]});
  if(c.has.exams){
    if(R("exams"))doc.exams=d.exams;
    else d.exams.forEach(e=>{
      const i=doc.exams.findIndex(x=>(t.keepIds&&x.id===e.id)||(x.date===e.date&&x.k===e.k&&lc(x.l)===lc(e.l)));
      if(i>=0)doc.exams[i]={...e,id:doc.exams[i].id};else doc.exams.push(e);
    });
    doc.exams.sort(byExam);
  }
  if(c.has.reviews){
    if(R("reviews"))doc.reviews.topics=d.reviews.topics;
    else d.reviews.topics.forEach(x=>{
      const i=doc.reviews.topics.findIndex(y=>(t.keepIds&&y.id===x.id)||(lc(y.n)===lc(x.n)&&y.k===x.k));
      if(i>=0)doc.reviews.topics[i]={...x,id:doc.reviews.topics[i].id};
      else{if(revTopic(x.id))x.id=uid("r");doc.reviews.topics.push(x)}
    });
  }
  if(c.has.notes){
    if(R("notes"))doc.notes=d.notes;
    else d.notes.forEach(x=>{const ex=doc.notes.find(y=>lc(y.h)&&lc(y.h)===lc(x.h));if(ex)ex.t=x.t;else doc.notes.push(x)});
  }
  if(R("subjects")){const u=usedKs();doc.subjects=doc.subjects.filter(s=>c.aiK.has(s.k)||u.has(s.k))}
  aiUndo={snap,title:t.title};
  planPid=null; dayEditing=null; aiS(id).json="";
  persist();
}
function aiSummary(n){
  return AI_ORDER.filter(k=>n[k]).map(k=>`${n[k]} ${n[k]===1?AI_SEC[k].one:AI_SEC[k].many}`).join(", ");
}
function aiFixMsg(err){
  return"O aplicativo não conseguiu importar sua última resposta. Problema encontrado: "+err+"\n\nPor favor, reenvie a resposta COMPLETA em UM único bloco de código json válido: aspas duplas, sem comentários, sem vírgulas sobrando, sem \"...\" e sem resumir itens, seguindo exatamente o formato combinado. Se ela for longa demais para uma mensagem, divida em partes, cada uma sendo um bloco json completo no mesmo formato.";
}
async function copyText(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg);return true}
  catch(e){
    const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;opacity:0;top:0";
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e2){}ta.remove();
    toast(ok?msg:"Não deu para copiar sozinho: selecione o texto e copie");return ok;
  }
}

function aiImport(id,btn){

function aiAct(act,el){

    case"ai-fix":{const c=aiCheck(s.json,id);return c&&c.err&&copyText(aiFixMsg(c.err),"Mensagem copiada. Cole na conversa com a IA")}
    case"ai-paste":
      if(!navigator.clipboard||!navigator.clipboard.readText){$("ai-json").focus();return toast("Toque na caixa e use Colar do teclado")}
      return navigator.clipboard.readText().then(tx=>{if(!tx)return toast("A área de transferência está vazia");s.json=tx;render();toast("Resposta colada. Confira abaixo")},()=>{$("ai-json").focus();toast("O navegador não deixou: toque na caixa e use Colar")});
    case"ai-file":return $("ai-file").click();

  }

    async onSave(v){
      if(v.pw.length<4)return"A nova senha precisa ter pelo menos 4 caracteres.";
      if(v.pw!==v.pw2)return"As senhas novas não conferem.";
      const accs=accounts(), a=accs.find(x=>x.id===account.id); if(!a)return"Conta não encontrada.";
      const k0=await deriveKey(v.old,unb64(a.salt),a.iter||PBKDF2_ITER);
      try{await unseal(k0,a.ver)}catch(e){return"Senha atual incorreta."}
      const salt=crypto.getRandomValues(new Uint8Array(16)), k=await deriveKey(v.pw,salt,PBKDF2_ITER);
      await saveChain;
      if(!store.set(DATA_PREFIX+a.id,JSON.stringify(await seal(k,doc))))return"Não foi possível salvar.";
      a.salt=b64(salt); a.iter=PBKDF2_ITER; a.ver=await seal(k,"ok"); saveAccounts(accs);
      key=k;
      const s=JSON.stringify({id:a.id,k:b64(await crypto.subtle.exportKey("raw",k))});
      sess.set(SESS_KEY,s); if(store.get(SESS_KEY))store.set(SESS_KEY,s);
    }
  });
}
twoStep($("btn-delacc"),$("delacc-lab"),"Excluir conta deste aparelho","Apaga tudo desta conta. Clique de novo",async()=>{
  const id=account.id;
  await saveChain;
  store.del(DATA_PREFIX+id); saveAccounts(accounts().filter(a=>a.id!==id));
  logout("Conta excluída deste aparelho");
});

/* ===================== eventos da interface ===================== */
const pop=$("acct-pop"), acctBtn=$("acct-btn");
function closePop(){pop.hidden=true;acctBtn.setAttribute("aria-expanded","false")}
acctBtn.addEventListener("click",e=>{e.stopPropagation();pop.hidden=!pop.hidden;acctBtn.setAttribute("aria-expanded",String(!pop.hidden))});
document.addEventListener("click",e=>{if(!pop.hidden&&!pop.contains(e.target)&&e.target!==acctBtn)closePop()});
pop.addEventListener("keydown",e=>{if(e.key==="Escape"){closePop();acctBtn.focus()}});

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el||!doc&&!el.closest("#auth"))return;
  const act=el.dataset.act, id=el.dataset.id;
  const dtg={kind:"day",date:route.date}, rtg={kind:"rot",pid:planPid,wd:planWd};
  if(act.startsWith("ai-"))return aiAct(act,el);
  switch(act){
    case"nav":return step(+el.dataset.dir);
    case"cal-open":return calEl.hidden?openCal(el):closeCal(true);
    case"jump":{const t=document.getElementById(el.dataset.to);if(t)t.closest("section").scrollIntoView({behavior:"smooth",block:"start"});return}
    case"now-done":{
      if(!nowBlock)return;
      doc.done[TODAY+"|"+nowBlock.id]=1; persist(); render();
      if(!celebrate(TODAY))toast("Bloco concluído");
      return;
    }
    case"day-edit":dayEditing=dayEditing===route.date?null:route.date;return render();
    case"blk-add":dayEditing=route.date;render();return editBlock(dtg,null);
    case"blk-edit":return editBlock(dtg,id);
    case"blk-up":return moveBlock(dtg,id,-1);
    case"blk-down":return moveBlock(dtg,id,1);
    case"day-tag":return editDayTag(route.date);
    case"day-reset":uncustomize(route.date);return commit("Este dia voltou a seguir a rotina");
    case"cday-reset":uncustomize(el.dataset.date);return commit("Dia voltou a seguir a rotina");
    case"exam-add":return editExam(null,el.dataset.date||(route.v==="dia"?route.date:TODAY));
    case"exam-edit":return editExam(id);
    case"rev-add":return editTopic(null);
    case"rev-edit":{const t=revTopic(id);return t&&editTopic(t)}
    case"rev-done":{const t=revTopic(id);return t&&reviewDone(t)}
    case"rev-tab":revTab=el.dataset.tab;return render();
    case"per-sel":planPid=id;return render();
    case"per-add":return editPeriod(null);
    case"per-edit":return editPeriod(curPlanPeriod());
    case"wd-sel":planWd=+el.dataset.wd;return render();
    case"wd-copy":return copyWeekday();
    case"rblk-add":return editBlock(rtg,null);
    case"rblk-edit":return editBlock(rtg,id);
    case"rblk-up":return moveBlock(rtg,id,-1);
    case"rblk-down":return moveBlock(rtg,id,1);
    case"subj-add":return editSubject(null);
    case"subj-edit":{const s=subj(el.dataset.k);return s&&editSubject(s)}
    case"note-add":return editNote(null);
    case"note-edit":{const n=doc.notes.find(x=>x.id===id);return n&&editNote(n)}
    case"theme":
      theme=el.dataset.theme; theme==="auto"?store.del(THEME_KEY):store.set(THEME_KEY,theme); applyTheme(); return;
    case"ai":closePop();return go("ia");
    case"export":closePop();return exportBackup();
    case"import":closePop();return $("file-import").click();
    case"pw":closePop();return changePassword();
    case"logout":return logout("Você saiu da conta");
  }
});
/* comemora quando o dia fica completo */
function celebrate(date){
  const s=stats(date);
  if(s.n&&s.k===s.n){toast(date===TODAY?"Dia concluído! Ótimo trabalho.":"Dia "+shortDate(date)+" concluído!",true);return true}
  return false;
}
document.addEventListener("change",e=>{
  if(!doc)return;
  const c=e.target.closest("[data-done]");
  if(c){
    const k=c.dataset.done;
    if(c.checked)doc.done[k]=1;else delete doc.done[k];
    persist();
    const li=c.closest(".blk,.cb"); if(li)li.classList.toggle("done",c.checked);
    if(c.checked)celebrate(k.slice(0,10));
    renderSoon(); return;
  }
  const p=e.target.closest("[data-pick]");
  if(p&&validDate(p.value))go(route.v==="dia"||route.v==="semana"||route.v==="mes"?route.v:"dia",p.value,true);
});
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-pick]");
  if(p&&typeof p.showPicker==="function"){try{p.showPicker()}catch(err){}}
});
/* teclado: ← → navegam, H volta para hoje */
document.addEventListener("keydown",e=>{
  if(!doc||e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey)return;
  if(document.querySelector("dialog[open]")||!pop.hidden||!calEl.hidden)return;
  if(e.target.closest("input,textarea,select,[contenteditable]"))return;
  if(!["dia","semana","mes"].includes(route.v))return;
  if(e.key==="ArrowLeft"){e.preventDefault();step(-1)}
  else if(e.key==="ArrowRight"){e.preventDefault();step(1)}
  else if(e.key==="h"||e.key==="H"||e.key==="t"||e.key==="T")step(0);
});
/* deslizar para os lados troca de dia, semana ou mês */
let tx0=0,ty0=0,tt0=0;
viewEl.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;tt0=Date.now()},{passive:true});
viewEl.addEventListener("touchend",e=>{
  if(!doc||!["dia","semana","mes"].includes(route.v)||!tt0)return;
  const t=e.changedTouches[0], dx=t.clientX-tx0, dy=t.clientY-ty0, dt=Date.now()-tt0; tt0=0;
  if(e.target.closest("dialog,.pop"))return;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8&&dt<700)step(dx<0?1:-1);
},{passive:true});

  if(!doc||!account||e.key!==DATA_PREFIX+account.id||!e.newValue)return;

/* se o app ficar aberto de um dia para o outro, atualiza "hoje" e o cartão "Agora" */
function tick(){
  if(!doc)return;
  const t=getToday();
  if(t!==TODAY){
    const wasToday=route.v==="dia"&&route.date===TODAY;
    TODAY=t;
    if(wasToday){route=parseRoute();history.replaceState(null,"",hashFor("dia",TODAY));route.date=TODAY}
    render(); return;
  }
  if(route.v==="dia"&&route.date===TODAY&&!document.querySelector("dialog[open]")){
    const before=lastNow; nowHTML(); if(lastNow!==before)render();
  }
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")tick()});
setInterval(tick,60000);

/* aviso curto */
let toastTimer=0;
function toast(msg,yay){const t=$("toast");t.textContent=msg;t.classList.toggle("yay",!!yay);t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2400)}

/* ===================== tela de login ===================== */
let authMode="in";
const authForm=$("auth-form");
function showAuth(){
  document.body.classList.remove("app-on");
  $("app").hidden=true; $("auth").hidden=false;
  authForm.reset(); showErr("auth-err","");
  setAuthMode(accounts().length?"in":"up");
}
function setAuthMode(m){
  authMode=m;
  $("tab-in").setAttribute("aria-selected",String(m==="in")); $("tab-up").setAttribute("aria-selected",String(m==="up"));
  authForm.querySelectorAll("[data-up]").forEach(x=>{x.hidden=m!=="up"});
  authForm.pw.autocomplete=m==="up"?"new-password":"current-password";
  $("auth-go").textContent=m==="up"?"Criar conta e entrar":"Entrar";
  showErr("auth-err","");
  const sel=$("auth-start"); sel.textContent="";
  const legacy=hasLegacy(), done=store.get(LEGACY_FLAG);
  if(legacy)sel.add(new Option("Meu cronograma salvo neste navegador","legacy"));
  sel.add(new Option("Criar com a IA (recomendado)","ai"));
  sel.add(new Option("Usar o cronograma de exemplo","sample"));
  sel.add(new Option("Começar em branco","blank"));
  sel.value=legacy&&!done?"legacy":"ai"; startHint();
  const accs=accounts(), box=$("auth-accs");
  box.hidden=m!=="in"||!accs.length; box.textContent="";
  if(accs.length){
    const l=document.createElement("span"); l.className="lbl2"; l.textContent="Contas neste aparelho:"; box.appendChild(l);
    accs.forEach(a=>{
      const b=document.createElement("button"); b.type="button"; b.className="btn chip";
      b.textContent=a.name&&a.name!==a.user?`${a.name} (${a.user})`:a.user;
      b.addEventListener("click",()=>{authForm.user.value=a.user;authForm.pw.focus()});
      box.appendChild(b);
    });
  }
}
const START_HINT={ai:"Depois de entrar, o app mostra um passo a passo: uma IA faz perguntas sobre sua rotina e monta o ano para você.",sample:"Uma rotina pronta de estudante de Medicina, com uma semana de provas, para conhecer o app e editar.",blank:"Tudo vazio: você monta a rotina à mão em Planejar (ou com a IA, quando quiser).",legacy:"Traz o cronograma e o progresso que você já tinha salvo neste navegador."};
function startHint(){$("auth-start-hint").textContent=START_HINT[$("auth-start").value]||""}
$("auth-start").addEventListener("change",startHint);
document.querySelectorAll("[data-auth]").forEach(b=>b.addEventListener("click",()=>setAuthMode(b.dataset.auth)));
authForm.addEventListener("click",e=>{
  const eye=e.target.closest('[data-act="pw-eye"]'); if(!eye)return;
  const inp=authForm.pw, show=inp.type==="password";
  inp.type=show?"text":"password"; if(authForm.pw2)authForm.pw2.type=inp.type;
  eye.setAttribute("aria-label",show?"Ocultar senha":"Mostrar senha");
});
authForm.addEventListener("submit",async e=>{
  e.preventDefault();
  const f={user:normUser(authForm.user.value),pw:authForm.pw.value,remember:authForm.remember.checked};
  if(!USER_RE.test(f.user))return showErr("auth-err","Usuário: 2 a 32 caracteres, só letras minúsculas, números, ponto, hífen ou sublinhado.");
  if(authMode==="up"){
    f.name=authForm.name.value.trim()||f.user; f.start=authForm.start.value;
    if(f.pw.length<4)return showErr("auth-err","A senha precisa ter pelo menos 4 caracteres.");
    if(f.pw!==authForm.pw2.value)return showErr("auth-err","As senhas não conferem.");
  }else if(!f.pw)return showErr("auth-err","Digite a senha.");
  const btn=$("auth-go"), lab=btn.textContent;
  btn.disabled=true; btn.textContent=authMode==="up"?"Criando conta…":"Entrando…"; showErr("auth-err","");
  try{authMode==="up"?await signUp(f):await signIn(f)}
  catch(err){showErr("auth-err",err&&err.message||"Não foi possível entrar.")}
  finally{btn.disabled=false;btn.textContent=lab}
});

function enterApp(){

}

(async function init(){
  applyTheme(); buildNav();
  if(!(window.crypto&&crypto.subtle)){
    $("boot").hidden=true; showAuth();
    showErr("auth-err","Este navegador não oferece criptografia nesta página. Abra o site pelo endereço https:// (GitHub Pages) ou por http://localhost.");
    $("auth-go").disabled=true; return;
  }
  let ok=false; try{ok=await resume()}catch(e){}
  $("boot").hidden=true;

})();
